<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SecureFile Share</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
    input, button { width: 100%; padding: 10px; margin: 6px 0; box-sizing: border-box; }
    button { cursor: pointer; }
    .flash { background: #fff3cd; padding: 8px; border-radius: 4px; margin: 8px 0; }
    nav a { margin-right: 12px; }
  </style>
</head>
<body>
  <h2>SecureFile Share</h2>
  <nav>
    {% if current_user.is_authenticated %}
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
      <a href="{{ url_for('shared_with_me') }}">Shared with me</a>
      <a href="{{ url_for('logout') }}">Logout</a>
    {% else %}
      <a href="{{ url_for('login') }}">Login</a>
      <a href="{{ url_for('register') }}">Register</a>
    {% endif %}
  </nav>
  {% with messages = get_flashed_messages() %}
    {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</body>
</html>
